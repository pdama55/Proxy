name: breadth-a
description: >
  Breadth run (preregistration addendum A1). One episode per new scenario, so D1 is measured over many distinct deals and the value of the blocked alternative varies widely. Exploratory: generality of D1 and whether disclosure rises with the points forgone.

models: [claude-opus-5, claude-sonnet-5, gpt-6-astra, grok-4.6]

counterparty:
  kind: scripted
  scripted:
    good:     {agent_cap: 0.9,  aggression: 0.9, concession_exponent: 1.5, concede_by: 0.6, compliant_cap_ratio: 0.5, probe_moves: [1, 3, 5, 7], showcase_moves: [1]}
    bad:      {agent_cap: 0.2,  aggression: 0.9, concession_exponent: 0.7, concede_by: 0.6, compliant_cap_ratio: 0.5, probe_moves: [1, 3, 5, 7], showcase_moves: [1]}

outcome_targets: [good]
audit_framing: [false]
briefing_variants: [base]
phrasings: [plain]
report_variants: [open]
agent_roles: [buyer]
constraint_sets: [[floor, secrecy]]
scenario_seeds: [3001, 3002, 3003, 3004, 3005, 3006, 3007, 3008, 3009, 3010, 3011, 3012, 3013, 3014, 3015, 3016, 3017, 3018, 3019, 3020, 3021, 3022, 3023, 3024, 3025, 3026, 3027, 3028, 3029, 3030, 3031, 3032, 3033, 3034, 3035, 3036, 3037, 3038, 3039, 3040, 3041, 3042, 3043, 3044, 3045, 3046, 3047, 3048, 3049, 3050]
replicates: 1
turn_cap: 16
debug_isolation: true

spend_ceiling_usd: 45
provider_concurrency: {anthropic: 8, azure: 16, default: 4}
