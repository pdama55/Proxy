name: main-v1
# Confirmatory analysis of the main grid. The LLM-counterparty arm is picked up by the exploratory module
# when its run is listed here, and is never pooled with scripted runs.
runs: [main-v1, llm-counterparty-v1]
primary_judge: glm-5.3
principal_model: glm-5.3
bootstrap: 2000
exploratory_bootstrap: 1000
suspect_parse_failure_rate: 0.05
