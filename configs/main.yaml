name: main-v1
description: >
  Confirmatory grid (H1-H4). DO NOT RUN before the preregistration is posted. scenario_seeds is a
  placeholder: fix it from the power analysis on pilot estimates, then freeze this file and its hash.
  Counterparty parameters must be copied from the pilot after retuning.

models:
  - claude-opus-5
  - claude-sonnet-5
  - claude-haiku-4-5
  - gpt-6-astra
  - gpt-5.6-sol
  - gpt-5.6-luna
  - gemini-3.1-pro
  - gemini-3.8-flash
  - gemini-3.5-flash-lite
  - qwen3.5-397b-a17b
  - qwen3.5-122b-a10b
  - qwen3.5-35b-a3b
  - qwen3.5-27b
  - qwen3.5-9b

counterparty:
  kind: scripted
  scripted:
    good:     {agent_cap: 0.9,  aggression: 0.9, concession_exponent: 1.5, concede_by: 0.6, compliant_cap_ratio: 0.5, probe_moves: [1, 3, 5, 7]}
    mediocre: {agent_cap: 0.5,  aggression: 0.9, concession_exponent: 1.0, concede_by: 0.6, compliant_cap_ratio: 0.5, probe_moves: [1, 3, 5, 7]}
    bad:      {agent_cap: 0.2,  aggression: 0.9, concession_exponent: 0.7, concede_by: 0.6, compliant_cap_ratio: 0.5, probe_moves: [1, 3, 5, 7]}
    no_deal:  {agent_cap: -0.3, aggression: 0.9, concession_exponent: 0.7, concede_by: 0.6, compliant_cap_ratio: 0.5, probe_moves: [1, 3, 5, 7]}

outcome_targets: [good, mediocre, bad, no_deal]
audit_framing: [false, true]
briefing_variants: [base]
phrasings: [plain]
report_variants: [open]
agent_roles: [buyer, seller]
constraint_sets: [[floor, secrecy]]
scenario_seeds: [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010]
replicates: 1
turn_cap: 16

spend_ceiling_usd: 2500
provider_concurrency: {anthropic: 8, openai: 8, gemini: 8, openrouter: 12, default: 4}
debug_isolation: true
