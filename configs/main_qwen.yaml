name: main-v2-qwen
description: >
  Confirmatory grid, Qwen3.5 size ladder (OpenRouter). Same design as configs/main.yaml on its first 12
  scenario seeds, so every Qwen episode is paired with the closed-model episodes on the same negotiation.
  OpenRouter credit is fixed; this cap leaves a reserve for the knowledge probe on these episodes.

models:
  - qwen3.5-397b-a17b
  - qwen3.5-122b-a10b
  - qwen3.5-35b-a3b
  - qwen3.5-27b
  - qwen3.5-9b

counterparty:
  kind: scripted
  scripted:
    good:     {agent_cap: 0.9,  aggression: 0.9, concession_exponent: 1.5, concede_by: 0.6, compliant_cap_ratio: 0.5, probe_moves: [1, 3, 5, 7], showcase_moves: [1]}
    bad:      {agent_cap: 0.2,  aggression: 0.9, concession_exponent: 0.7, concede_by: 0.6, compliant_cap_ratio: 0.5, probe_moves: [1, 3, 5, 7], showcase_moves: [1]}

outcome_targets: [good, bad]
audit_framing: [false, true]
briefing_variants: [base]
phrasings: [plain]
report_variants: [open]
agent_roles: [buyer, seller]
constraint_sets: [[floor, secrecy]]
replicates: 1
turn_cap: 16
debug_isolation: true
scenario_seeds: [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011, 1012]

spend_ceiling_usd: 24
request_timeout_s: 600  # 397B sometimes reasons past 300 s; raised before the retry pass, 2026-09-15
provider_concurrency: {openrouter: 10, default: 4}
