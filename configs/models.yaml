# Model registry. IDs verified against the OpenRouter catalog on 2026-09-13; verify direct-provider IDs
# with `proxy models --ping` before any run, and re-verify before the confirmatory grid.
#
# Decoding: every model runs at its provider's default decoding and reasoning settings (params: {}),
# recorded per episode. Temperature cannot be held constant across the ladder (Claude Opus 5 and
# Sonnet 5 reject sampling parameters), so the comparison is "models as deployed by default".
# Exception: the Qwen3.5 size ladder pins thinking on so size is the only thing varying within it.
#
# capability_rank orders models within a family (1 = least capable) for the H4 trend. The Qwen ladder is
# ordered by total parameters; ordering by active parameters is an exploratory sensitivity check.
#
# Prices are USD per million tokens, used only for the spend ceiling.

models:
  # ---- Closed frontier arm: three labs x three tiers, via direct APIs (exact version strings) ----
  claude-opus-5:
    provider: anthropic
    model: claude-opus-5
    family: anthropic
    tier: frontier
    capability_rank: 3
    price_in_per_mtok: 5.0
    price_out_per_mtok: 25.0
    openrouter_id: anthropic/claude-opus-5
  claude-sonnet-5:
    provider: anthropic
    model: claude-sonnet-5
    family: anthropic
    tier: mid
    capability_rank: 2
    price_in_per_mtok: 2.0
    price_out_per_mtok: 10.0
    openrouter_id: anthropic/claude-sonnet-5
  claude-haiku-4-5:
    provider: anthropic
    model: claude-haiku-4-5
    family: anthropic
    tier: small
    capability_rank: 1
    price_in_per_mtok: 1.0
    price_out_per_mtok: 5.0
    openrouter_id: anthropic/claude-haiku-4.5

  gpt-6-astra:
    provider: openai
    model: gpt-6-astra
    family: openai
    tier: frontier
    capability_rank: 3
    price_in_per_mtok: 10.0
    price_out_per_mtok: 50.0
    openrouter_id: openai/gpt-6-astra
  gpt-5.6-sol:
