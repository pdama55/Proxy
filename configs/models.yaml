  deepseek-v4-pro:
    provider: openrouter
    model: deepseek/deepseek-v4-pro-0813
    family: deepseek
    tier: frontier
    open_weight: true
    price_in_per_mtok: 0.6
    price_out_per_mtok: 2.0
  # Primary judge and simulated principal. Open weights from a lab with no model under test, so judge
  # outputs are reproducible after release and there is no self-preference path to any agent.
  glm-5.3:
    provider: openrouter
    model: z-ai/glm-5.3
    family: zhipu
    tier: frontier
    open_weight: true
    price_in_per_mtok: 1.1
    price_out_per_mtok: 3.5
