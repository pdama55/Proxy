  qwen3.5-9b:
    provider: openrouter
    model: qwen/qwen3.5-9b
    family: qwen
    tier: small
    capability_rank: 1
    open_weight: true
    params: {extra_body: {reasoning: {enabled: true}}}
    price_in_per_mtok: 0.1
    price_out_per_mtok: 0.15

  # Same 9B weights served locally (free; for pipeline debugging on a 16 GB Mac: `ollama pull qwen3.5:9b`).
  qwen3.5-9b-local:
    provider: ollama
    model: qwen3.5:9b
    family: qwen
    tier: small
    capability_rank: 1
    open_weight: true

  # ---- Instruments: never agents under test ----
  # LLM counterparty for the external-validity arm. Dated snapshot, open weights, different lab.
  deepseek-v4-pro:
    provider: openrouter
    model: deepseek/deepseek-v4-pro-0813
    family: deepseek
    tier: frontier
    open_weight: true
    price_in_per_mtok: 0.6
    price_out_per_mtok: 2.0
  # ---- Additional families via Azure AI Foundry (deployed 2026-09-15, GlobalStandard) ----
  grok-4.6:
    provider: azure
    model: grok-4.6
    family: xai
    tier: frontier
    price_in_per_mtok: 3.0
    price_out_per_mtok: 15.0
