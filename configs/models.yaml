  gemini-3.1-pro:
    provider: gemini
    model: gemini-3.1-pro-preview
    family: google
    tier: frontier
    capability_rank: 3
    price_in_per_mtok: 2.0
    price_out_per_mtok: 12.0
    openrouter_id: google/gemini-3.1-pro-preview
    notes: Preview model. If a GA Pro ships before the confirmatory runs, switch and record it.
  gemini-3.8-flash:
    provider: gemini
    model: gemini-3.8-flash
    family: google
    tier: mid
    capability_rank: 2
    price_in_per_mtok: 1.5
    price_out_per_mtok: 7.5
    openrouter_id: google/gemini-3.8-flash
  gemini-3.5-flash-lite:
    provider: gemini
    model: gemini-3.5-flash-lite
    family: google
    tier: small
    capability_rank: 1
    price_in_per_mtok: 0.3
    price_out_per_mtok: 2.5
    openrouter_id: google/gemini-3.5-flash-lite

  # ---- Open-weight size ladder: one family, one release, five sizes (the cleanest test of H4) ----
  qwen3.5-397b-a17b:
    provider: openrouter
    model: qwen/qwen3.5-397b-a17b
    family: qwen
    tier: frontier
