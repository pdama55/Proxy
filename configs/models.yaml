# Model registry. IDs verified against the OpenRouter catalog on 2026-09-13; verify direct-provider IDs
# with `proxy models --ping` before any run, and re-verify before the confirmatory grid.
#
# Decoding: every model runs at its provider's default decoding and reasoning settings (params: {}),
# recorded per episode. Temperature cannot be held constant across the ladder (Claude Opus 5 and
# Sonnet 5 reject sampling parameters), so the comparison is "models as deployed by default".
# Exception: the Qwen3.5 size ladder pins thinking on so size is the only thing varying within it.
#
# capability_rank orders models within a family (1 = least capable) for the H4 trend. The Qwen ladder is
# ordered by total parameters; ordering by active parameters is an exploratory sensitivity check.
#
# Prices are USD per million tokens, used only for the spend ceiling. Azure prices are conservative
# estimates at or above list price; reconcile against Azure Cost Management after each run.
#
# provider: azure uses AZURE_OPENAI_ENDPOINT / AZURE_OPENAI_API_KEY; `model` is the deployment name.

models:
  # ---- Closed frontier arm: three labs x three tiers, via direct APIs (exact version strings) ----
  claude-fable-5-1:
    provider: anthropic
    model: claude-fable-5-1
    family: anthropic
    tier: frontier
    capability_rank: 4
    price_in_per_mtok: 10.0
    price_out_per_mtok: 50.0
    openrouter_id: anthropic/claude-fable-5-1
    notes: Anthropic's most capable widely released model. Thinking always on (no thinking or sampling params sent). Refusal fallbacks deliberately off.
  claude-opus-5:
    provider: anthropic
    model: claude-opus-5
    family: anthropic
    tier: frontier
    capability_rank: 3
    price_in_per_mtok: 5.0
    price_out_per_mtok: 25.0
    openrouter_id: anthropic/claude-opus-5
  claude-sonnet-5:
    provider: anthropic
    model: claude-sonnet-5
    family: anthropic
    tier: mid
    capability_rank: 2
    price_in_per_mtok: 2.0
    price_out_per_mtok: 10.0
    openrouter_id: anthropic/claude-sonnet-5
  claude-haiku-4-5:
    provider: anthropic
    model: claude-haiku-4-5
    family: anthropic
    tier: small
    capability_rank: 1
    price_in_per_mtok: 1.0
    price_out_per_mtok: 5.0
    openrouter_id: anthropic/claude-haiku-4.5

  gpt-6-astra:
    provider: azure  # deployment in parth-dama-3660-resource (GlobalStandard); model = deployment name
    model: gpt-6-astra
    family: openai
    tier: frontier
    capability_rank: 3
    price_in_per_mtok: 10.0
    price_out_per_mtok: 50.0
    openrouter_id: openai/gpt-6-astra
  gpt-5.6-sol:
    provider: azure  # deployment in parth-dama-3660-resource (GlobalStandard); model = deployment name
    model: gpt-5.6-sol
    family: openai
    tier: mid
    capability_rank: 2
    price_in_per_mtok: 2.0
    price_out_per_mtok: 10.0
    openrouter_id: openai/gpt-5.6-sol
  gpt-5.6-luna:
    provider: azure  # deployment in parth-dama-3660-resource (GlobalStandard); model = deployment name
    model: gpt-5.6-luna
    family: openai
    tier: small
    capability_rank: 1
    price_in_per_mtok: 0.2
    price_out_per_mtok: 1.2
    openrouter_id: openai/gpt-5.6-luna

  gemini-3.1-pro:
    provider: gemini
    model: gemini-3.1-pro-preview
    family: google
    tier: frontier
    capability_rank: 3
    price_in_per_mtok: 2.0
    price_out_per_mtok: 12.0
    openrouter_id: google/gemini-3.1-pro-preview
    notes: Preview model. If a GA Pro ships before the confirmatory runs, switch and record it.
  gemini-3.8-flash:
    provider: gemini
    model: gemini-3.8-flash
    family: google
    tier: mid
    capability_rank: 2
    price_in_per_mtok: 1.5
    price_out_per_mtok: 7.5
    openrouter_id: google/gemini-3.8-flash
  gemini-3.5-flash-lite:
    provider: gemini
    model: gemini-3.5-flash-lite
    family: google
    tier: small
    capability_rank: 1
    price_in_per_mtok: 0.3
    price_out_per_mtok: 2.5
    openrouter_id: google/gemini-3.5-flash-lite

  # ---- Open-weight size ladder: one family, one release, five sizes (the cleanest test of H4) ----
  qwen3.5-397b-a17b:
    provider: openrouter
    model: qwen/qwen3.5-397b-a17b
    family: qwen
    tier: frontier
    capability_rank: 5
    open_weight: true
    params: {extra_body: {reasoning: {enabled: true}}}
    price_in_per_mtok: 0.55
    price_out_per_mtok: 3.5
  qwen3.5-122b-a10b:
    provider: openrouter
    model: qwen/qwen3.5-122b-a10b
    family: qwen
    tier: mid
    capability_rank: 4
    open_weight: true
    params: {extra_body: {reasoning: {enabled: true}}}
    price_in_per_mtok: 0.26
    price_out_per_mtok: 2.08
  qwen3.5-35b-a3b:
    provider: openrouter
    model: qwen/qwen3.5-35b-a3b
    family: qwen
    tier: mid
    capability_rank: 3
    open_weight: true
    params: {extra_body: {reasoning: {enabled: true}}}
    price_in_per_mtok: 0.32
    price_out_per_mtok: 1.25
  qwen3.5-27b:
    provider: openrouter
    model: qwen/qwen3.5-27b
    family: qwen
    tier: small
    capability_rank: 2
    open_weight: true
