  # ---- Judges and simulated principal on Azure (families with no model under test) ----
  kimi-k2.6:
    provider: azure
    model: Kimi-K2.6
    family: moonshot
    tier: frontier
    open_weight: true
    price_in_per_mtok: 1.0
