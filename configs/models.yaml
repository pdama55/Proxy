    azure_pool_env: AZURE_KIMI_POOL  # deployments in eastus, westus3 and swedencentral, 100K TPM each
    notes: Primary judge and principal simulator from 2026-09-15 (OpenRouter judges ran out of credit).
  cohere-command-a-plus:
    provider: azure
    model: Cohere-command-a-plus-05-2026
    family: cohere
    tier: frontier
    price_in_per_mtok: 3.0
    price_out_per_mtok: 12.0
    notes: Second judge.
  # Primary judge and simulated principal. Open weights from a lab with no model under test, so judge
  # outputs are reproducible after release and there is no self-preference path to any agent.
  glm-5.3:
    provider: openrouter
    model: z-ai/glm-5.3
    family: zhipu
    tier: frontier
    open_weight: true
    price_in_per_mtok: 1.1
