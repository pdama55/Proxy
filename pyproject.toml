[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "proxy"
version = "0.1.0"
description = "Harness measuring whether delegated LLM negotiation agents report faithfully to their principal"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "pyyaml>=6",
  "anthropic>=1.0",
  "openai>=1.60",
  "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
analysis = ["pandas>=2.2", "scipy>=1.13", "statsmodels>=0.14", "matplotlib>=3.9"]

[project.scripts]
proxy = "proxy.cli:main"

[tool.setuptools.packages.find]
include = ["proxy*"]

[tool.setuptools.package-data]
"proxy.viewer" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
